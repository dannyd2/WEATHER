<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #0d0f12;
  --surface: #161a1f;
  --border: rgba(255,255,255,0.06);
  --text-primary: #f0ede8;
  --text-muted: #6b7280;
  --accent: #f5a623;
  --radius: 12px;
  --transition: 150ms ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  transition: background 0.4s ease;
}

body.night { --bg: #090b0f; --accent: #7eb8f7; background: var(--bg); }

.card {
  width: 100%;
  max-width: 420px;
  opacity: 0;
  transition: opacity 600ms ease 200ms;
}
.card.visible { opacity: 1; }

/* ── Top zone ── */
.location {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 8px;
}

.temp-display {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(100px, 18vw, 160px);
  line-height: 0.9;
  letter-spacing: -0.02em;
  text-align: center;
  color: var(--text-primary);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 4px;
}

.temp-value { display: inline-block; }

.temp-unit {
  font-family: 'DM Sans', sans-serif;
  font-size: 28px;
  font-weight: 300;
  color: var(--accent);
  margin-top: 20px;
}

.description {
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  font-weight: 400;
  color: var(--text-muted);
  text-align: center;
  margin-top: 12px;
  margin-bottom: 28px;
  min-height: 22px;
}

/* ── Stat pills ── */
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.pill {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform var(--transition);
  cursor: default;
}
.pill:hover { transform: scale(1.02); }

.pill-icon { color: var(--text-muted); flex-shrink: 0; }

.pill-text { display: flex; flex-direction: column; gap: 2px; }

.pill-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.pill-value {
  font-size: 18px;
  font-weight: 400;
  color: var(--text-primary);
}

/* ── Forecast strip ── */
.forecast-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-top: 4px;
}

.forecast {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 4px;
  gap: 4px;
}
.forecast::-webkit-scrollbar { display: none; }

.day-card {
  flex: 0 0 calc((100% - 32px) / 7);
  min-width: 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 6px;
  border-radius: 8px;
  transition: transform var(--transition);
  cursor: default;
  border-left: 3px solid transparent;
}
.day-card:hover { transform: translateY(-2px); }
.day-card.today {
  border-left-color: var(--accent);
  background: rgba(255,255,255,0.04);
}

.day-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.day-icon { color: var(--text-muted); }

.day-temps {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}

.day-high { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.day-low  { font-size: 11px; font-weight: 400; color: var(--text-muted); }

/* ── Skeleton ── */
.skeleton { display: none; }
.skeleton.active { display: block; }

@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50%       { opacity: 0.6; }
}

.skel-block {
  background: var(--surface);
  border-radius: 6px;
  animation: pulse 1.6s ease infinite;
}

.skeleton-ui {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
  max-width: 420px;
}

.skel-loc   { width: 120px; height: 12px; }
.skel-temp  { width: 200px; height: 120px; border-radius: 8px; }
.skel-desc  { width: 140px; height: 16px; }
.skel-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.skel-pill  { height: 64px; border-radius: var(--radius); }
.skel-strip { width: 100%; height: 90px; border-radius: var(--radius); }

/* ── Hourly panel ── */
.day-card { cursor: pointer; }

.day-card.active {
  border-left-color: var(--accent);
  background: rgba(255,255,255,0.07);
}

.forecast-wrap.panel-open {
  border-radius: var(--radius) var(--radius) 0 0;
}

.hourly-panel {
  background: var(--surface);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  border-radius: 0 0 var(--radius) var(--radius);
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height 320ms cubic-bezier(0.4, 0, 0.2, 1),
              opacity 200ms ease 60ms;
}
.hourly-panel.open {
  max-height: 200px;
  opacity: 1;
}

.hourly-scroll {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 6px 4px 8px;
  gap: 2px;
  border-top: 1px solid var(--border);
  position: relative;
}
.hourly-scroll::-webkit-scrollbar { display: none; }
.hourly-panel.open .hourly-scroll::after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  height: 100%;
  width: 32px;
  pointer-events: none;
  background: linear-gradient(to right, transparent, #161a1f);
}

.hour-card {
  flex: 0 0 64px;
  min-width: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 4px 6px;
  border-radius: 8px;
  border-top: 2px solid transparent;
}
.hour-card.current-hour {
  border-top-color: var(--accent);
  background: rgba(255,255,255,0.04);
}

.hour-date {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  line-height: 1;
}

.hour-time {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

.hour-icon { color: var(--text-muted); }

.hour-temp {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
}

.hour-precip {
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  color: #7eb8f7;
}

/* ── Error ── */
.error-ui {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
  max-width: 320px;
}
.error-ui.active { display: flex; }
.error-icon { color: var(--text-muted); }
.error-title { font-size: 18px; font-weight: 500; color: var(--text-primary); }
.error-msg { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
.error-retry {
  margin-top: 8px;
  padding: 10px 24px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-primary);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: border-color var(--transition);
}
.error-retry:hover { border-color: var(--accent); color: var(--accent); }

/* ── Marker pulse ── */
@keyframes marker-pulse {
  0%, 100% { transform: scale(1);   opacity: 1;   }
  50%       { transform: scale(1.4); opacity: 0.4; }
}

/* ── Leaflet overrides ── */
.leaflet-container { background: var(--bg) !important; }
.leaflet-control-attribution {
  background: rgba(13,15,18,0.8) !important;
  color: var(--text-muted) !important;
  font-size: 9px !important;
}
.leaflet-control-attribution a { color: var(--text-muted) !important; }

/* ── Map section ── */
.map-section { margin-top: 16px; }

.map-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.map-container {
  height: 340px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  position: relative;
  touch-action: none;
}

/* ── Leaflet zoom control dark theme ── */
.leaflet-bar {
  border: 1px solid rgba(255,255,255,0.06) !important;
  border-radius: 8px !important;
  box-shadow: none !important;
  overflow: hidden;
}
.leaflet-bar a {
  background: #161a1f !important;
  color: #f0ede8 !important;
  border-bottom: 1px solid rgba(255,255,255,0.06) !important;
  box-shadow: none !important;
}
.leaflet-bar a:last-child { border-bottom: none !important; }
.leaflet-bar a:hover { background: #1e2329 !important; }

#map { height: 100%; width: 100%; }

.map-legend {
  position: absolute;
  bottom: 10px;
  left: 10px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(13,15,18,0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 4px 10px;
  border-radius: 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  pointer-events: none;
}

.map-legend-bar {
  width: 52px;
  height: 4px;
  background: linear-gradient(to right, #04e9e7, #019ff4, #0300f4, #02fd02, #01c501, #008e00, #fdf802, #e5bc00, #fd9500, #fd0000, #d40000, #bc0000, #f800fd, #9854c6);
  border-radius: 2px;
}

/* ── On This Day section ── */
.otd-section { margin-top: 16px; }

.otd-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
}

.otd-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.otd-divider {
  height: 1px;
  background: rgba(255,255,255,0.06);
  margin: 14px 0;
}

.otd-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 3px;
}

.otd-value-lg {
  font-family: 'DM Serif Display', serif;
  font-size: 28px;
  color: var(--text-primary);
  line-height: 1.1;
}
.otd-value-lg.cold { color: #7eb8f7; }

.otd-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.otd-value-sm {
  font-size: 20px;
  font-weight: 500;
  color: var(--text-primary);
}
.otd-value-sm.cold { color: #7eb8f7; }

.otd-skel-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.otd-skel-cell { display: flex; flex-direction: column; gap: 5px; }
.skel-otd-lbl  { height: 10px; width: 65%; }
.skel-otd-lg   { height: 30px; width: 55%; }
.skel-otd-sub  { height: 10px; width: 45%; }
.skel-otd-sm   { height: 22px; width: 50%; }

/* ── Alert banners ── */
.alert-banner {
  width: 100%;
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-left: 4px solid;
  animation: slideDown 300ms ease forwards;
  overflow: hidden;
  pointer-events: auto;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.alert-banner .alert-event        { color: #f0ede8; font-weight: 600; }
.alert-banner .alert-headline     { color: #c4bfb8; }
.alert-banner .alert-details-text { color: #c4bfb8; }
.alert-banner .alert-expires      { color: #f5a623; font-weight: 600; }
.alert-banner .alert-icon         { color: #f0ede8; }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.alert-extreme  { background: #2a0f0f; border-color: #ff2d2d; }
.alert-severe   { background: #2a1a08; border-color: #ff8800; }
.alert-moderate { background: #2a2008; border-color: #f5a623; }
.alert-minor    { background: #0e1a2a; border-color: #7eb8f7; }

.alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

.alert-body { flex: 1; min-width: 0; }

.alert-event {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.3;
}

.alert-headline {
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.alert-details-text {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-top: 8px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 300ms cubic-bezier(0.4,0,0.2,1),
              opacity 200ms ease 60ms;
  opacity: 0;
}
.alert-details-text.open {
  max-height: 300px;
  opacity: 1;
}

.alert-expires {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 6px;
}

.alert-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}

.alert-btn-details {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  font-family: 'DM Sans', sans-serif;
}

.alert-btn-dismiss {
  font-size: 18px;
  line-height: 1;
  color: var(--text-muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  font-family: 'DM Sans', sans-serif;
}
.alert-btn-dismiss:hover { color: var(--text-primary); }
</style>
</head>
<body>

<!-- Alert banners — fixed overlay, zero layout shift when empty -->
<div id="alertsContainer" style="position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 32px));z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>

<!-- Skeleton loader -->
<div class="skeleton active" id="skeleton">
  <div class="skeleton-ui">
    <div class="skel-block skel-loc"></div>
    <div class="skel-block skel-temp"></div>
    <div class="skel-block skel-desc"></div>
    <div class="skel-grid">
      <div class="skel-block skel-pill"></div>
      <div class="skel-block skel-pill"></div>
      <div class="skel-block skel-pill"></div>
      <div class="skel-block skel-pill"></div>
    </div>
    <div class="skel-block skel-strip"></div>
  </div>
</div>

<!-- Main card -->
<div class="card" id="card">
  <div class="location" id="location">—</div>
  <div class="temp-display">
    <span class="temp-value" id="temp">—</span>
    <span class="temp-unit">°F</span>
  </div>
  <div class="description" id="description">Loading…</div>

  <div class="stats">
    <div class="pill">
      <div class="pill-icon"><?xml version="1.0"?><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></div>
      <div class="pill-text">
        <span class="pill-label" id="feelsLabel">Feels Like</span>
        <span class="pill-value" id="feels">—</span>
      </div>
    </div>
    <div class="pill">
      <div class="pill-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div>
      <div class="pill-text">
        <span class="pill-label">Humidity</span>
        <span class="pill-value" id="humidity">—</span>
      </div>
    </div>
    <div class="pill">
      <div class="pill-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg></div>
      <div class="pill-text">
        <span class="pill-label">Wind</span>
        <span class="pill-value" id="wind">—</span>
      </div>
    </div>
    <div class="pill">
      <div class="pill-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="19" x2="8" y2="21"/><line x1="8" y1="13" x2="8" y2="15"/><line x1="16" y1="19" x2="16" y2="21"/><line x1="16" y1="13" x2="16" y2="15"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="12" y1="15" x2="12" y2="17"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg></div>
      <div class="pill-text">
        <span class="pill-label">Precipitation</span>
        <span class="pill-value" id="precip">—</span>
      </div>
    </div>
  </div>

  <div class="forecast-wrap" id="forecastWrap">
    <div class="forecast" id="forecast"></div>
  </div>
  <div class="hourly-panel" id="hourlyPanel">
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>

  <div class="otd-section" id="otdSection">
    <div class="map-label">On This Day</div>
    <div class="otd-card" id="otdCard">
      <div class="otd-skel-row">
        <div class="otd-skel-cell">
          <div class="skel-block skel-otd-lbl"></div>
          <div class="skel-block skel-otd-lg"></div>
          <div class="skel-block skel-otd-sub"></div>
        </div>
        <div class="otd-skel-cell">
          <div class="skel-block skel-otd-lbl"></div>
          <div class="skel-block skel-otd-lg"></div>
          <div class="skel-block skel-otd-sub"></div>
        </div>
      </div>
      <div class="otd-divider"></div>
      <div class="otd-skel-row">
        <div class="otd-skel-cell">
          <div class="skel-block skel-otd-lbl"></div>
          <div class="skel-block skel-otd-sm"></div>
        </div>
        <div class="otd-skel-cell">
          <div class="skel-block skel-otd-lbl"></div>
          <div class="skel-block skel-otd-sm"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="map-section">
    <div class="map-label">Forecast Map</div>
    <div class="map-container">
      <div id="map"></div>
      <div class="map-legend" id="mapLegend">
        <span>Light</span>
        <div class="map-legend-bar"></div>
        <span>Heavy</span>
      </div>
    </div>
  </div>
</div>

<!-- Error state -->
<div class="error-ui" id="errorUi">
  <div class="error-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
  <div class="error-title" id="errorTitle">Something went wrong</div>
  <div class="error-msg" id="errorMsg">Unable to load weather data.</div>
  <button class="error-retry" id="retryBtn">Try again</button>
</div>

<script>
// ── Module state ──────────────────────────────────────────────────────────
let hourlyData     = null;
let dailyDates     = [];
let activeDayIndex = null;
let leafletMap     = null;
let radarLayer     = null;
let locationCircle = null;
let userLat        = null;
let userLon        = null;
let dismissedAlertIds = new Set();
let activeAlertIds    = new Set();

// ── Constants ──────────────────────────────────────────────────────────────
const REFRESH_MS    = 10 * 60 * 1000;
const MAP_REFRESH_MS = 5 * 60 * 1000;
const FETCH_TIMEOUT  = 8000;
const API_BASE       = 'https://api.open-meteo.com/v1/forecast';
const GEO_BASE       = 'https://nominatim.openstreetmap.org/reverse';
const IEM_RADAR_URL  = 'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png';
const HISTORY_API    = 'https://archive-api.open-meteo.com/v1/archive';
const NWS_ALERTS_URL = 'https://api.weather.gov/alerts/active';
const ALERTS_TIMEOUT = 8000;
const DAYS           = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const WMO = {

// ── SVG icons (24×24 stroke, returns HTML string) ─────────────────────────
function icon(group, isDay = true, size = 24) {
  const s = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"`;
  const icons = {
    clear_day:   `<svg ${s}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
    clear_night: `<svg ${s}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
    partly:      `<svg ${s}><circle cx="9" cy="10" r="4"/><line x1="9" y1="3" x2="9" y2="5"/><line x1="3" y1="10" x2="5" y2="10"/><line x1="14.66" y1="5.34" x2="13.24" y2="6.76"/><path d="M14 16H7a4 4 0 0 1 0-8 4.05 4.05 0 0 1 .54.04A5.5 5.5 0 1 1 14 16z"/></svg>`,
    overcast:    `<svg ${s}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>`,
    fog:         `<svg ${s}><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="16" x2="21" y2="16"/></svg>`,
    drizzle:     `<svg ${s}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><line x1="8" y1="22" x2="10" y2="18"/><line x1="14" y1="22" x2="16" y2="18"/></svg>`,
    rain:        `<svg ${s}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><line x1="7" y1="22" x2="9" y2="18"/><line x1="12" y1="22" x2="14" y2="18"/><line x1="17" y1="22" x2="19" y2="18"/></svg>`,
    snow:        `<svg ${s}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><line x1="8" y1="22" x2="8" y2="18"/><line x1="8" y1="20" x2="6" y2="20"/><line x1="8" y1="20" x2="10" y2="20"/><line x1="14" y1="22" x2="14" y2="18"/><line x1="14" y1="20" x2="12" y2="20"/><line x1="14" y1="20" x2="16" y2="20"/></svg>`,
    thunder:     `<svg ${s}><path d="M19 16.9A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><polyline points="13 11 9 17 15 17 11 23"/></svg>`,
  };
  if (group === 'clear') return isDay ? icons.clear_day : icons.clear_night;
  return icons[group] || icons.overcast;
}

// ── Fetch with timeout via AbortController ─────────────────────────────────
async function fetchWithTimeout(url) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(tid);
  }
}

// ── Resolve WMO code to label ──────────────────────────────────────────────
function wmoInfo(code) {
  return WMO[code] || WMO[Math.floor(code / 10) * 10] || { d: 'Unknown', g: 'overcast' };
}

// ── Get user geolocation ───────────────────────────────────────────────────
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('DENIED'));
      return;
    }
    navigator.geolocation.getCurrentPosition(resolve, err => {
      reject(new Error(err.code === 1 ? 'DENIED' : 'GEO_ERR'));
    }, { timeout: 10000 });
  });
}

// ── Reverse geocode lat/lon to city name ──────────────────────────────────
async function reverseGeocode(lat, lon) {
  try {
    const data = await fetchWithTimeout(`${GEO_BASE}?lat=${lat}&lon=${lon}&format=json`);
    const a = data.address || {};
    return a.city || a.town || a.village || a.county || a.state || 'Unknown location';
  } catch {
    return 'Unknown location';
  }
}

// ── Fetch weather from Open-Meteo ─────────────────────────────────────────
async function fetchWeather(lat, lon) {
  const params = new URLSearchParams({
    latitude:          lat,
    longitude:         lon,
    current:           'temperature_2m,apparent_temperature,precipitation,weathercode,windspeed_10m,relativehumidity_2m,is_day',
    daily:             'weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
    temperature_unit:  'fahrenheit',
    windspeed_unit:    'mph',
    precipitation_unit:'inch',
    timezone:          'auto',
    forecast_days:     7,
  });
  return fetchWithTimeout(`${API_BASE}?${params}`);
}

// ── Fetch hourly weather data ──────────────────────────────────────────────
async function fetchHourly(lat, lon) {
  const params = new URLSearchParams({
    latitude:          lat,
    longitude:         lon,
    hourly:            'temperature_2m,weathercode,precipitation_probability,windspeed_10m,apparent_temperature',
    temperature_unit:  'fahrenheit',
    windspeed_unit:    'mph',
    precipitation_unit:'inch',
    timezone:          'auto',
    forecast_days:     7,
  });
  return fetchWithTimeout(`${API_BASE}?${params}`);
}

// ── Format ISO timestamp to "9 AM" / "12 PM" ──────────────────────────────
function formatHour(isoStr) {
  const h = new Date(isoStr).getHours();
  if (h === 0)  return '12 AM';
  if (h < 12)   return `${h} AM`;
  if (h === 12) return '12 PM';
  return `${h - 12} PM`;
}

// ── Render hourly scroll content for a given day index ────────────────────
function renderHourlyPanel(dayIndex) {
  if (!hourlyData || dayIndex === null) return;
  const scroll    = document.getElementById('hourlyScroll');
  const targetDate = dailyDates[dayIndex];
  const now        = new Date();
  const currentH   = now.getHours();
  const isToday    = dayIndex === 0;

  const allHours = hourlyData.time
    .map((t, i) => ({ t, i }))
    .filter(({ t }) => t.startsWith(targetDate));

  const hours = isToday
    ? allHours.filter(({ t }) => new Date(t).getHours() >= currentH)
    : allHours;

  scroll.innerHTML = hours.map(({ t, i }) => {
    const d          = new Date(t);
    const h          = d.getHours();
    const isCurrent  = isToday && h === currentH;
    const precipProb = hourlyData.precipitation_probability[i];
    const showPrecip = precipProb != null && precipProb >= 10;
    const wInfo      = wmoInfo(hourlyData.weathercode[i]);
    const isDayHour  = h >= 6 && h < 20;

    const dateLabelHtml = h === 0
      ? `<span class="hour-date">${DAYS[d.getDay()]}</span>`
      : '';

    const precipHtml = showPrecip
      ? `<span class="hour-precip"><svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>${precipProb}%</span>`
      : '';

    return `<div class="hour-card${isCurrent ? ' current-hour' : ''}">
        ${dateLabelHtml}
        <span class="hour-time">${formatHour(t)}</span>
        <div class="hour-icon">${icon(wInfo.g, isDayHour, 20)}</div>
        <span class="hour-temp">${Math.round(hourlyData.temperature_2m[i])}°</span>
        ${precipHtml}
      </div>`;
  }).join('');
}

// ── Toggle hourly panel open/closed for a clicked day index ───────────────
function toggleDay(dayIndex) {
  const panel      = document.getElementById('hourlyPanel');
  const forecastWrap = document.getElementById('forecastWrap');
  const cards      = document.querySelectorAll('.day-card');

  if (activeDayIndex === dayIndex) {
    activeDayIndex = null;
    panel.classList.remove('open');
    forecastWrap.classList.remove('panel-open');
    cards.forEach(c => c.classList.remove('active'));
  } else {
    activeDayIndex = dayIndex;
    cards.forEach((c, i) => c.classList.toggle('active', i === dayIndex));
    renderHourlyPanel(dayIndex);
    panel.classList.add('open');
    forecastWrap.classList.add('panel-open');
  }
}

// ── Initialize Leaflet map at user location ────────────────────────────────
function initMap(lat, lon) {
  if (leafletMap) return;

  leafletMap = L.map('map', {
    center: [lat, lon],
    zoom: 7,
    minZoom: 4,
    maxZoom: 12,
    dragging: true,
    touchZoom: true,
    scrollWheelZoom: true,
    doubleClickZoom: true,
    boxZoom: true,
    keyboard: true,
    zoomControl: true,
    attributionControl: true,
  });

  leafletMap.setMinZoom(4);
  leafletMap.setMaxZoom(12);
  leafletMap.zoomControl.setPosition('bottomright');
  userLat = lat;
  userLon = lon;

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(leafletMap);

  leafletMap.getPane('overlayPane').style.filter  = 'saturate(2.0) contrast(1.3) brightness(1.15)';
  leafletMap.getPane('overlayPane').style.opacity = '0.85';

  radarLayer = L.tileLayer(IEM_RADAR_URL, {
    opacity: 0.75,
    zIndex: 500,
    attribution: 'Radar: IEM NEXRAD',
  }).addTo(leafletMap);
  setLegendState(true);

  const markerHtml = '<div style="width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid white;animation:marker-pulse 2s ease infinite;"></div>';
  L.marker([lat, lon], {
    icon: L.divIcon({ html: markerHtml, className: '', iconSize: [12, 12], iconAnchor: [6, 6] }),
  }).addTo(leafletMap);

  setTimeout(() => leafletMap.invalidateSize(), 100);
}

// ── Update the legend pill content ────────────────────────────────────────
function setLegendState(hasRadar) {
  const legend = document.getElementById('mapLegend');
  if (!legend) return;
  legend.innerHTML = hasRadar
    ? '<span>Light</span><div class="map-legend-bar"></div><span>Heavy</span>'
    : '<span>Local Area Map</span>';
}

// ── Show a muted 50 km proximity circle when radar is unavailable ──────────
function showLocationCircle() {
  if (locationCircle || !leafletMap || !userLat) return;
  locationCircle = L.circle([userLat, userLon], {
    radius: 50000,
    color: '#f5a623',
    fillColor: '#f5a623',
    fillOpacity: 0.04,
    weight: 1,
    opacity: 0.3,
  }).addTo(leafletMap);
  setLegendState(false);
}

// ── Bust IEM tile cache so Leaflet re-fetches fresh radar every 5 min ────────
function refreshRadarOverlay() {
  if (!radarLayer) return;
  radarLayer.setUrl(`${IEM_RADAR_URL}?t=${Date.now()}`);
}

// ── Fetch 40 years of historical daily data for today's calendar date ────────
async function fetchHistorical(lat, lon) {
  const now  = new Date();
  const pad  = n => String(n).padStart(2, '0');
  const year = now.getFullYear();
  const mm   = pad(now.getMonth() + 1);
  const dd   = pad(now.getDate());
  const params = new URLSearchParams({
    latitude:         lat,
    longitude:        lon,
    start_date:       `${year - 40}-01-01`,
    end_date:         `${year}-${mm}-${dd}`,
    daily:            'temperature_2m_max,temperature_2m_min',
    temperature_unit: 'fahrenheit',
    timezone:         'auto',
  });
  return fetchWithTimeout(`${HISTORY_API}?${params}`);
}

// ── Process historical data and render the On This Day card ──────────────────
function renderHistorical(data) {
  const section = document.getElementById('otdSection');
  const card    = document.getElementById('otdCard');
  const now     = new Date();
  const targetMD = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

  const entries = (data.daily?.time || [])
    .map((d, i) => ({
      year: d.slice(0, 4),
      max:  data.daily.temperature_2m_max[i],
      min:  data.daily.temperature_2m_min[i],
      md:   d.slice(5),
    }))
    .filter(e => e.md === targetMD && e.max != null && e.min != null);

  if (!entries.length) { section.style.display = 'none'; return; }

  const recHigh = entries.reduce((a, b) => b.max > a.max ? b : a);
  const recLow  = entries.reduce((a, b) => b.min < a.min ? b : a);
  const avgHigh = Math.round(entries.reduce((s, e) => s + e.max, 0) / entries.length);
  const avgLow  = Math.round(entries.reduce((s, e) => s + e.min, 0) / entries.length);

  card.innerHTML = `
    <div class="otd-grid">
      <div>
        <div class="otd-label">Record High</div>
        <div class="otd-value-lg">${Math.round(recHigh.max)}°F</div>
        <div class="otd-sub">set in ${recHigh.year}</div>
      </div>
      <div>
        <div class="otd-label">Record Low</div>
        <div class="otd-value-lg cold">${Math.round(recLow.min)}°F</div>
        <div class="otd-sub">set in ${recLow.year}</div>
      </div>
    </div>
    <div class="otd-divider"></div>
    <div class="otd-grid">
      <div>
        <div class="otd-label">Avg High</div>
        <div class="otd-value-sm">${avgHigh}°F</div>
      </div>
      <div>
        <div class="otd-label">Avg Low</div>
        <div class="otd-value-sm cold">${avgLow}°F</div>
      </div>
    </div>`;
}

// ── Render the forecast strip ──────────────────────────────────────────────
function renderForecast(daily) {
  dailyDates = daily.time;
  const strip  = document.getElementById('forecast');
  strip.innerHTML = daily.time.map((dateStr, i) => {
    const d        = new Date(dateStr + 'T12:00:00');
    const wInfo    = wmoInfo(daily.weathercode[i]);
    const isToday  = i === 0;
    const isActive = i === activeDayIndex;
    return `
      <div class="day-card${isToday ? ' today' : ''}${isActive ? ' active' : ''}" data-day-index="${i}">
        <span class="day-label">${isToday ? 'Today' : DAYS[d.getDay()]}</span>
        <div class="day-icon">${icon(wInfo.g, true, 20)}</div>
        <div class="day-temps">
          <span class="day-high">${Math.round(daily.temperature_2m_max[i])}°</span>
          <span class="day-low">${Math.round(daily.temperature_2m_min[i])}°</span>
        </div>
      </div>`;
  }).join('');
}

// ── Apply day/night body class ─────────────────────────────────────────────
function applyDayNight(isDay) {
  document.body.classList.toggle('night', !isDay);
}

// ── NWS wind chill / heat index / neutral feels-like ──────────────────────
function calcFeelsLike(temp, humidity, windspeed, apparentTemp) {
  if (temp <= 50 && windspeed >= 3) {
    const v016 = Math.pow(windspeed, 0.16);
    const wc   = 35.74 + (0.6215 * temp) - (35.75 * v016) + (0.4275 * temp * v016);
    return { value: Math.round(wc) + '°F', label: 'Wind Chill', color: '#7eb8f7' };
  }
  if (temp >= 80 && humidity >= 40) {
    let hi = -42.379
      + (2.04901523  * temp)
      + (10.14333127 * humidity)
      - (0.22475541  * temp * humidity)
      - (0.00683783  * temp * temp)
      - (0.05481717  * humidity * humidity)
      + (0.00122874  * temp * temp * humidity)
      + (0.00085282  * temp * humidity * humidity)
      - (0.00000199  * temp * temp * humidity * humidity);
    if (humidity < 13 && temp >= 80 && temp <= 112)
      hi -= ((13 - humidity) / 4) * Math.sqrt((17 - Math.abs(temp - 95)) / 17);
    if (humidity > 85 && temp >= 80 && temp <= 87)
      hi += ((humidity - 85) / 10) * ((87 - temp) / 5);
    return { value: Math.round(hi) + '°F', label: 'Heat Index', color: '#ff8800' };
  }
  return { value: Math.round(apparentTemp) + '°F', label: 'Feels Like', color: 'var(--text-primary)' };
}

// ── Severity → CSS class and icon ─────────────────────────────────────────
function alertClass(severity) {
  return { Extreme: 'alert-extreme', Severe: 'alert-severe',
           Moderate: 'alert-moderate', Minor: 'alert-minor' }[severity] || 'alert-minor';
}

function alertIcon(severity) {
  return severity === 'Minor' ? 'ℹ' : '⚠';
}

// ── Format ISO expiry to "Mon 3:45 PM" ────────────────────────────────────
function formatAlertExpiry(iso) {
  if (!iso) return '';
  const d    = new Date(iso);
  const day  = DAYS[d.getDay()];
  let h      = d.getHours();
  const m    = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `Expires: ${day} ${h}:${String(m).padStart(2, '0')} ${ampm}`;
}

// ── Fetch and render NWS alerts — called independently, never blocks render ─
async function fetchAndRenderAlerts(lat, lon) {
  try {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), ALERTS_TIMEOUT);
    const res  = await fetch(`${NWS_ALERTS_URL}?point=${lat},${lon}`, { signal: ctrl.signal });
    clearTimeout(tid);
    if (!res.ok) return;
    const data = await res.json();

    const features = (data.features || [])
      .filter(f => f.properties?.status === 'Actual' && f.properties?.messageType !== 'Cancel')
      .sort((a, b) => {
        const order = ['Extreme', 'Severe', 'Moderate', 'Minor'];
        return order.indexOf(a.properties.severity) - order.indexOf(b.properties.severity);
      });

    const container = document.getElementById('alertsContainer');
    const newIds    = new Set(features.map(f => f.properties.id));
    activeAlertIds  = newIds;

    features.forEach(f => {
      const p  = f.properties;
      const id = p.id;
      if (dismissedAlertIds.has(id)) return;
      if (document.getElementById('alert-' + id)) return;

      const banner = document.createElement('div');
      banner.className = `alert-banner ${alertClass(p.severity)}`;
      banner.id = 'alert-' + id;
      const safeId = id.replace(/'/g, "\\'");
      banner.innerHTML = `
        <div class="alert-icon">${alertIcon(p.severity)}</div>
        <div class="alert-body">
          <div class="alert-event">${p.event || 'Weather Alert'}</div>
          <div class="alert-headline">${p.headline || ''}</div>
          <div class="alert-details-text" id="alertDetails-${id}">
            <div>${(p.description || '').replace(/\n/g, '<br>')}</div>
            <div class="alert-expires">${formatAlertExpiry(p.expires)}</div>
          </div>
        </div>
        <div class="alert-actions">
          <button class="alert-btn-details" onclick="toggleAlertDetails('${safeId}')">Details</button>
          <button class="alert-btn-dismiss" onclick="dismissAlert('${safeId}')">×</button>
        </div>`;
      container.appendChild(banner);
    });

    // Remove banners for alerts no longer active
    container.querySelectorAll('.alert-banner').forEach(el => {
      const elId = el.id.slice('alert-'.length);
      if (!newIds.has(elId)) el.remove();
    });
  } catch (_) { /* fail silently */ }
}

// ── Toggle alert details panel ─────────────────────────────────────────────
function toggleAlertDetails(id) {
  const el = document.getElementById('alertDetails-' + id);
  if (el) el.classList.toggle('open');
}

// ── Dismiss a single alert banner ──────────────────────────────────────────
function dismissAlert(id) {
  dismissedAlertIds.add(id);
  const el = document.getElementById('alert-' + id);
  if (el) el.remove();
}

// ── Populate UI with weather data ──────────────────────────────────────────
function renderWeather(data, city) {
  const c = data.current;
  const isDay = c.is_day === 1;
  const wInfo = wmoInfo(c.weathercode);

  applyDayNight(isDay);

  document.getElementById('location').textContent    = city.toUpperCase();
  document.getElementById('temp').textContent        = Math.round(c.temperature_2m);
  document.getElementById('description').textContent = wInfo.d;
  const fl = calcFeelsLike(c.temperature_2m, c.relativehumidity_2m, c.windspeed_10m, c.apparent_temperature);
  document.getElementById('feelsLabel').textContent  = fl.label;
  document.getElementById('feels').textContent       = fl.value;
  document.getElementById('feels').style.color       = fl.color;
  document.getElementById('humidity').textContent    = `${c.relativehumidity_2m}%`;
  document.getElementById('wind').textContent        = `${Math.round(c.windspeed_10m)} mph`;

  const precip = data.daily.precipitation_probability_max[0];
  document.getElementById('precip').textContent = precip != null ? `${precip}%` : `${c.precipitation} in`;

  renderForecast(data.daily);
}

// ── Show error state ───────────────────────────────────────────────────────
function showError(title, msg) {
  document.getElementById('skeleton').classList.remove('active');
  document.getElementById('card').classList.remove('visible');
  const ui = document.getElementById('errorUi');
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMsg').textContent   = msg;
  ui.classList.add('active');
}

// ── Hide error, show card ──────────────────────────────────────────────────
function showCard() {
  document.getElementById('errorUi').classList.remove('active');
  document.getElementById('skeleton').classList.remove('active');
  requestAnimationFrame(() => {
    document.getElementById('card').classList.add('visible');
    if (leafletMap) leafletMap.invalidateSize();
  });
}

// ── Main data load routine ─────────────────────────────────────────────────
async function loadWeather() {
  const isFirstLoad = activeDayIndex === null;
  document.getElementById('errorUi').classList.remove('active');
  document.getElementById('skeleton').classList.add('active');
  document.getElementById('card').classList.remove('visible');

  let lat, lon;
  try {
    const pos = await getPosition();
    lat = pos.coords.latitude;
    lon = pos.coords.longitude;
  } catch (err) {
    if (err.message === 'DENIED') {
      showError('Location access denied', 'Enable location permission in your browser settings, then try again.');
    } else {
      showError('Location unavailable', 'Could not determine your location. Please check your device settings.');
    }
    return;
  }

  try {
    const [weather, hourly, city] = await Promise.all([
      fetchWeather(lat, lon),
      fetchHourly(lat, lon),
      reverseGeocode(lat, lon),
    ]);
    hourlyData = hourly.hourly;
    renderWeather(weather, city);
    if (isFirstLoad) {
      toggleDay(0);
      initMap(lat, lon);
      refreshRadarOverlay();
      fetchHistorical(lat, lon)
        .then(data => renderHistorical(data))
        .catch(() => { document.getElementById('otdSection').style.display = 'none'; });
    } else {
      renderHourlyPanel(activeDayIndex);
    }
    showCard();
    fetchAndRenderAlerts(lat, lon);
  } catch (err) {
    if (err.name === 'AbortError') {
      showError('Request timed out', 'The weather service took too long to respond. Check your connection and try again.');
    } else {
      showError('Couldn\'t load weather', 'There was a problem fetching data. Please check your internet connection.');
    }
  }
}

// ── Boot ───────────────────────────────────────────────────────────────────
document.getElementById('retryBtn').addEventListener('click', loadWeather);

document.getElementById('forecast').addEventListener('click', e => {
  const card = e.target.closest('.day-card');
  if (!card) return;
  const idx = parseInt(card.dataset.dayIndex, 10);
  if (!isNaN(idx)) toggleDay(idx);
});

loadWeather();
setInterval(loadWeather, REFRESH_MS);
setInterval(refreshRadarOverlay, MAP_REFRESH_MS);
setInterval(() => { if (userLat && userLon) fetchAndRenderAlerts(userLat, userLon); }, REFRESH_MS);
</script>
